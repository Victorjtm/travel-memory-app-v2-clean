<section class="mapa-wrapper">
  <header class="toolbar">
    <h2>Mapa de viajes previstos</h2>
    <div class="acciones">
      <button class="btn secundario" (click)="volver()">Volver</button>
      <button class="btn primario" (click)="migrarUbicaciones()" [disabled]="cargando">
        Migrar ubicaciones
      </button>
      <button class="btn" (click)="cargarViajes()" [disabled]="cargando">
        Recargar
      </button>
    </div>
  </header>

  <p class="estado" *ngIf="mensaje">{{ mensaje }}</p>

  <div id="mapa-viajes-previstos" class="mapa"></div>

  <p class="contador">Viajes con ubicación: {{ viajes.length }}</p>
</section>
