<div class="tipos-container">
    <label *ngFor="let tipo of tiposObj" class="tipo-option">
      <input
        type="radio"
        name="tipoDeViaje"
        [value]="tipo.value"
        [(ngModel)]="tipoSeleccionado"
        (change)="seleccionarTipo(tipo.value)"
      />
      {{ tipo.label }}
    </label>
  </div>
