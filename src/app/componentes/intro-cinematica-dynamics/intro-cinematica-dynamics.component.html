<div class="intro-dynamics-container" [class.desvaneciendo]="tiempoActual >= (DURACION_TOTAL - 0.7)" *ngIf="activo">
  <canvas #introCanvas class="intro-dynamics-canvas"></canvas>

  <button *ngIf="permitirSaltar && tiempoActual < (DURACION_TOTAL - 0.7)" 
          type="button" 
          class="btn-saltar-intro" 
          (click)="saltarIntro()" 
          title="Saltar introducción cinemática">
    <span>Saltar</span>
    <i class="fas fa-forward"></i>
  </button>
</div>
